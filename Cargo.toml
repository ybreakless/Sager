[package]
name = "sager"
version = "0.1.0"
edition = "2021"
authors = ["Sager Team"]
description = "Sager - Windows System Tray Game Companion for Steam Achievements & Ludusavi-style Save Backups"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiny_http = "0.12"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
walkdir = "2.5"
open = "5.3"
windows-sys = { version = "0.59", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_Media_Audio",
    "Win32_System_Threading",
    "Win32_Graphics_Gdi"
] }
